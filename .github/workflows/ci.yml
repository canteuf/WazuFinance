# Contrôles à chaque push et à chaque pull request : typage, lint, tests Jest, et tests pgTAP sur une base neuve construite à partir de toutes les migrations.
#
# Deux jobs indépendants, qui tournent en parallèle : une migration cassée n'empêche pas de voir un défaut de typage, et inversement.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typage, lint, Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Même version que les builds EAS (eas.json) : les paquets Supabase exigent Node 22 ou plus.
          node-version: 22.20.0
          cache: npm

      - run: npm ci

      - name: Typage
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests Jest
        run: npm test -- --ci

      # Versions alignées sur le SDK : une dépendance qui dérive est signalée ici plutôt qu'au build EAS. Un avertissement, pas un échec : Expo publie des correctifs de modules natifs (expo-updates, expo-dev-client) que l'on ne peut prendre qu'avec un nouveau build, et la CI virait au rouge à chaque publication, sans que le code ait changé.
      - name: Versions des dépendances Expo
        run: npx expo install --check || echo "::warning title=Dépendances Expo::Des paquets sont en retard sur le SDK (voir ce journal). Les aligner avec npx expo install --fix, puis un nouveau build si un module natif change."

      # Le bundle que Metro construit pour Android : tsc ne voit ni un require d'image cassé, ni une résolution de module que seul Metro fait. Valeurs factices : elles ne sont qu'inlinées, jamais appelées.
      - name: Bundle Android
        run: npx expo export --platform android --output-dir ${{ runner.temp }}/bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Migrations et tests pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Épinglée par commit, comme toutes les actions : `v1` est une branche, que son propriétaire peut déplacer, et ce dépôt est public.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Même version que la CLI du projet (npx supabase --version), comme db-backup.yml dans canteuf/WazuFinance-ops.
          version: 2.117.0

      # Toutes les migrations sont appliquées dans l'ordre sur une base vide : une migration qui ne passe que sur une base déjà migrée échoue ici, avant `db push`. Les services que les tests n'utilisent pas ne sont pas démarrés ; Auth reste, parce que ses propres migrations complètent le schéma auth que handle_new_user() et les tests utilisent.
      - name: Démarrer la base locale
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Tests pgTAP
        run: supabase test db
