# Empêche la mise en pause du projet Supabase.
#
# Sur le plan gratuit, un projet sans activité pendant 7 jours est mis en pause : l'app ne répond plus jusqu'à une relance manuelle depuis le tableau de bord. Tant que l'app a peu d'utilisateurs, une vraie requête tous les deux jours suffit à l'éviter. Une requête SQL et non un simple appel de santé de l'API : c'est l'activité de la base qui compte.
#
# La sauvegarde nocturne (db-backup.yml) se connecte aussi chaque nuit ; ce workflow reste séparé pour qu'une sauvegarde en échec — chiffrement, stockage — ne laisse pas le projet s'endormir, et pour signaler plus tôt une base injoignable.
#
# Secret du dépôt : SUPABASE_DB_URL, le même que pour la sauvegarde.

name: Maintien de la base en activité

on:
  schedule:
    # Tous les deux jours à 06:00 UTC : trois passages par période de 7 jours, un échec isolé ne suffit pas à laisser passer la pause.
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL requis (voir l'en-tête de db-backup.yml)."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only \
            --command "select count(*) as categories from public.categories"
